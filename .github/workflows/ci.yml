name: CI / Automated Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test Suite & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for LaTeX PDF testing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Modular Resume Compiler Tests
        env:
          AUTH_DISABLED: "true"
          OPENROUTER_API_KEY: ""
        run: |
          python -m unittest backend/test_modular_resume.py

      - name: Run Resume Autofill & Parser Tests
        env:
          AUTH_DISABLED: "true"
        run: |
          python -m unittest backend/test_resume_autofill.py

  build-frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: "https://api.autoapply.example.com"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: interview-autoapply-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: interview-autoapply-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
